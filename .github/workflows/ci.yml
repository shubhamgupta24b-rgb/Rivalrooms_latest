name: RivalRooms Latest CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --platforms=android --project-name rivalrooms_latest .
      # google_mobile_ads 6.0.0 currently needs the Gradle 8 API surface.
      - name: Pin Android build tooling
        shell: bash
        run: |
          sed -i 's/gradle-[0-9.]*-all.zip/gradle-8.14.3-all.zip/' android/gradle/wrapper/gradle-wrapper.properties
          python3 - <<'PY'
          from pathlib import Path
          import re
          for name in ("settings.gradle.kts", "settings.gradle"):
              path = Path("android") / name
              if not path.exists():
                  continue
              lines = path.read_text().splitlines()
              for i, line in enumerate(lines):
                  if "com.android.application" in line and "version" in line:
                      lines[i] = re.sub(r"version\\s+['\\"][^'\\"]+['\\"]", 'version "8.11.1"', line)
                  if "org.jetbrains.kotlin.android" in line and "version" in line:
                      lines[i] = re.sub(r"version\\s+['\\"][^'\\"]+['\\"]", 'version "2.2.20"', line)
              path.write_text("\n".join(lines) + "\n")
              print("Pinned Android plugins in", path)
              break
          PY
      - run: flutter pub get
      - run: dart format lib test
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: rivalrooms-latest-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
