name: RivalRooms Latest CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --platforms=android --project-name rivalrooms_latest .
      # google_mobile_ads 6.0.0 currently needs the Gradle 8 API surface.
      - name: Pin Android build tooling
        shell: bash
        run: |
          sed -i 's/gradle-[0-9.]*-all.zip/gradle-8.14.3-all.zip/' android/gradle/wrapper/gradle-wrapper.properties
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/settings.gradle.kts")
          if not path.exists():
              path = Path("android/settings.gradle")
          if not path.exists():
              raise SystemExit("Flutter did not generate Android settings.gradle(.kts)")

          lines = path.read_text().splitlines()
          found_android = found_kotlin = False
          version_pattern = "version" + chr(92) + 's+"[^"]+"'
          for i, line in enumerate(lines):
              if "com.android.application" in line and "version" in line:
                  lines[i] = re.sub(version_pattern, 'version "8.11.1"', line)
                  found_android = True
              if "org.jetbrains.kotlin.android" in line and "version" in line:
                  lines[i] = re.sub(version_pattern, 'version "2.2.20"', line)
                  found_kotlin = True

          if not found_android or not found_kotlin:
              raise SystemExit(f"Plugin pin failed: AGP={found_android}, Kotlin={found_kotlin}")

          path.write_text(chr(10).join(lines) + chr(10))
          print(f"Pinned AGP 8.11.1 and Kotlin 2.2.20 in {path}")
          PY
      - run: flutter pub get
      - run: dart format lib test
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: rivalrooms-latest-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
